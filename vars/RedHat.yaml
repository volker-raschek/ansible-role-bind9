---

bind9_binary: /usr/sbin/named

bind9_main_config: /etc/named.conf
bind9_config_directory: /etc/named
bind9_log_directory: /var/log/named

bind9_package_names:
- bind
- bind-utils # for dig and tsig-keygen and so on

bind9_service_name: named
bind9_systemd_dropin_dir: "/etc/systemd/system/{{ bind9_service_name }}.service.d"

bind9_unix_user: named
bind9_unix_group: named
